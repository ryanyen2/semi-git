<!DOCTYPE html>
<!-- Local dev preview of the Composition Workbench webview, outside VS Code. Mocks
     acquireVsCodeApi, supplies VS Code "Dark Modern" theme tokens (unused today -- workbench.css
     is self-themed -- kept for when it adopts vscode-* tokens), and feeds a sample `compose_view`
     bundle shaped like workbench.ts's `pushState` message. Open in a browser or screenshot
     headless (per the visual-surfaces rule: "the user can't see a webview you can't
     screenshot"). Not shipped (under dev/, .vscodeignore'd). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="../media/workbench.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="titlebar">
    <button id="compositionBtn" class="composition-btn">HEAD</button>
    <span id="oracleChip" class="oracle-chip" data-state="pending">oracle: pending</span>
  </div>
  <div id="main">
    <div id="rail"></div>
    <div id="inspector"></div>
  </div>
</div>
<script>
  let _st = null;
  window.acquireVsCodeApi = () => ({
    postMessage(msg) { console.log("[webview -> host]", msg); },
    getState: () => _st,
    setState: (s) => { _st = s; },
  });
</script>
<script src="../media/workbench.js"></script>
<script>
  const node = (id, parent, children, extra) =>
    Object.assign({ id, parent, children, label: id, size: 1, op_count: 1, dir: `src/${id}/`, why: `why ${id}`, split_reason: null }, extra);
  const map = {
    roots: ["subsys"],
    nodes: [
      node("subsys", null, ["auth", "billing"], { kind: "subsystem", label: "Core" }),
      node("auth", "subsys", [], { kind: "feature" }),
      node("billing", "subsys", [], { kind: "feature" }),
    ],
    edges: [{ a: "auth", b: "billing", weight: 2.0 }],
    identity_events: [], feature_count: 2,
  };
  const history = {
    commits: [{ sha: "a", subject: "c0", index: 0 }, { sha: "b", subject: "c1", index: 1 }, { sha: "c", subject: "c2", index: 2 }],
    ops: [
      { id: "op1", kind: "add", feature_id: "auth", commit_index: 0 },
      { id: "op2", kind: "rework", feature_id: "billing", commit_index: 1 },
      { id: "op3", kind: "extend", feature_id: "auth", commit_index: 2 },
    ],
  };
  const compose = {
    map, history,
    status: {
      files: 4, symbols: 12, features: 2, coverage_fraction: 0.9,
      oracle: { configured: true, status: "pass" },
      drift: { any: false, paths: [] }, unmanaged: [], backstop_kept: [],
      forks: { open: 0, records: [] },
    },
    forks: { open: 0, forks: [] },
    plan: { sessions: [], checkpoint: { matches: [], drift_op_ids: [] } },
    drift: { entries: [] },
    sessions: { sessions: [{ name: "sess-1", branch: "feat/auth", target_branch: "main", scratch: "/tmp/x", new_op_count: 2, owner_pid: 123, alive: true }], overlaps: [] },
    trust: { groups: [], total_ops: 0 },
    oracle_verdict: null,
    proposals: [{ id: "p1", title: "Ship auth", base_ref: "main", created_ts: 0, delta_op_count: 2, feature_delta: ["auth"] }],
  };
  window.dispatchEvent(new MessageEvent("message", { data: { type: "state", compose } }));
</script>
</body>
</html>
