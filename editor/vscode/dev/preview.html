<!DOCTYPE html>
<!-- Local dev preview of the Composition Workbench webview, outside VS Code. Mocks
     acquireVsCodeApi, supplies VS Code "Dark Modern" theme tokens (unused today -- workbench.css
     is self-themed -- kept for when it adopts vscode-* tokens), and feeds a sample `compose_view`
     bundle shaped like workbench.ts's `pushState` message. Open in a browser or screenshot
     headless (per the visual-surfaces rule: "the user can't see a webview you can't
     screenshot"). Not shipped (under dev/, .vscodeignore'd). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="../media/workbench.css" rel="stylesheet">
<style>
/* VS Code "Dark Modern" tokens. The header above used to say these were unused because
   workbench.css was self-themed -- it is not, and has not been for a long time: it reads
   --vscode-editor-background, --vscode-foreground and a dozen more. Without them the preview drew
   every panel with NO background and a serif body font, so the find dropdown appeared transparent
   over the timeline and the whole page looked like a rendering bug. A preview that misrepresents
   the surface is worse than no preview: it is what a screenshot gets checked against. */
:root {
  --vscode-editor-background: #1f1f1f;
  --vscode-editorWidget-background: #202020;
  --vscode-foreground: #cccccc;
  --vscode-descriptionForeground: #9d9d9d;
  --vscode-panel-border: #2b2b2b;
  --vscode-widget-border: #313131;
  --vscode-focusBorder: #0078d4;
  --vscode-charts-blue: #4daafc;
  --vscode-charts-green: #6bbf7b;
  --vscode-charts-red: #e5675f;
  --vscode-charts-yellow: #d9a441;
  --vscode-editorWarning-foreground: #cca700;
  --vscode-testing-iconPassed: #73c991;
  --vscode-testing-iconFailed: #f14c4c;
  --vscode-textCodeBlock-background: #181818;
  --vscode-input-background: #313131;
  --vscode-input-foreground: #cccccc;
  --vscode-input-border: #3c3c3c;
  --vscode-list-hoverBackground: #2a2d2e;
  --vscode-list-inactiveSelectionBackground: #37373d;
  --vscode-toolbar-hoverBackground: #383b41;
  --vscode-button-background: #0078d4;
  --vscode-button-foreground: #ffffff;
  --vscode-button-hoverBackground: #026ec1;
  --vscode-button-secondaryBackground: #313131;
  --vscode-button-secondaryHoverBackground: #3c3c3c;
  --vscode-diffEditor-insertedLineBackground: rgba(70, 149, 74, 0.22);
  --vscode-diffEditor-removedLineBackground: rgba(219, 76, 63, 0.22);
  --vscode-editor-font-family: "SF Mono", Menlo, Consolas, monospace;
  --vscode-font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--vscode-editor-background);
             color: var(--vscode-foreground); font-family: var(--vscode-font-family); }
#app { height: 100%; }
</style>
</head>
<body>
<div id="app">
  <!-- Five controls, and every one of them is something a reader of this history needs.
       What used to be here as well: a Timeline│Rail view toggle, a composition selector over
       HEAD-plus-sessions, an oracle chip, a Plans M/N chip with a popover, and a drift indicator
       drawn as a bare glyph. Each was a live control -- the oracle chip RAN the tiers on click --
       for machinery nobody reading a history is engaged in, and together they made the first
       thing in the eyeline a row of terms that have to be dismissed before the work is visible. -->
  <div id="titlebar">
    <div class="tb-zone tb-nav">
      <button id="groupBtn" class="group-btn" title="Group rows by subsystem, or list features by what you touched last">Features</button>
    </div>
    <div class="tb-zone tb-find">
      <input id="findBox" class="find-box" type="search" spellcheck="false"
             placeholder="find… e.g. the thing that formats dates"
             title="describe what you are looking for; Enter to search, Esc to clear" />
      <div id="findResults" class="find-results" hidden></div>
    </div>
    <div id="titlebarActions" class="titlebar-actions">
      <button id="ledgerBtn" title="Open the ledger: the same history as a document, newest first">Ledger</button>
      <button id="inspectorToggle" title="Hide detail panel">Hide details</button>
      <button id="saveBtn" title="ugh save: record and commit">Save</button>
      <button id="undoBtn" title="ugh undo">Undo</button>
    </div>
  </div>
  <!-- The context strip: one standing statement at a time, between the title bar and the map,
       which it pushes down and never covers: the armed merge/move question, or a focused piece
       of cross-feature work with its verbs. Hidden when it has nothing to say. These two used to
       float over the plot as bordered pills. -->
  <div id="strip">
    <div id="armedBanner" class="armed-banner" hidden></div>
    <div id="themeBanner" class="theme-banner" hidden></div>
  </div>
  <div id="main">
    <div id="rail"></div>
    <!-- Lanes a held preview changes that are scrolled out of view: a glow on the rail's edge,
         counted in the status line, clickable to scroll there. -->
    <button id="offscreenAbove" class="edge-glow edge-glow-top" hidden></button>
    <button id="offscreenBelow" class="edge-glow edge-glow-bottom" hidden></button>
    <div id="confirmBar" class="confirm-bar" hidden></div>
    <div id="inspector"></div>
  </div>
  <div id="statusline">
    <div id="presence" title="what you are looking at, and any unsaved work"></div>
    <div id="previewContext" class="preview-context-pill" hidden></div>
    <div id="previewRefusal" class="preview-refusal-pill" hidden></div>
  </div>
</div>
<script>
  let _st = null;
  // Kept, not just logged: the panels that ask the host a question (a change projection, a fold)
  // sequence their replies, so anything driving this page has to answer with the seq the page
  // actually asked on. Without the record there is no way to reach those panels from outside.
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage(msg) { window.__posted.push(msg); console.log("[webview -> host]", msg); },
    getState: () => _st,
    setState: (s) => { _st = s; },
  });
</script>
<script>
  // `?raf=timer`: run requestAnimationFrame on timers. Headless Chrome's virtual time starves rAF
  // (four frames in 2.5 s of budget), so anything frame-driven -- the playhead's spring, a glide --
  // looks stuck in a capture. Timers do advance under virtual time, so this lets a `--virtual-time-
  // budget=N` screenshot show the N-th millisecond of a motion. Not for VS Code, which has real frames.
  if (new URLSearchParams(location.search).get("raf") === "timer") {
    window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
    window.cancelAnimationFrame = (id) => clearTimeout(id);
  }
</script>
<script src="../media/workbench.js"></script>
<script src="./fixture.js"></script>
<script>
  // The same payload `smoke.js` renders, built by the same code (dev/fixture.js). This page used
  // to carry its own three-node map with no `grid`, so it drew an empty plot -- the one thing a
  // preview exists to rule out.
  // `?fx=<file>` renders another capture (a scratch copy of a real repository) through the same builder
  const fx = new URLSearchParams(location.search).get("fx") || "fixture-compose.json";
  fetch("./" + fx)
    .then((r) => r.json())
    .then((raw) => {
      // a capture may nest the compose under `compose` (the ledger fixtures do)
      window.__fixture = buildComposeFixture(raw.compose || raw);
      // `?hues=1`: the real identity colours (src/color.ts, dark theme) instead of the fixture's
      // placeholder greys, so a capture shows what the panel shows
      // `?light=1`: VS Code "Light Modern" tokens and the light body class, so the second theme gets looked at
      const light = !!new URLSearchParams(location.search).get("light");
      if (light) {
        document.body.classList.add("vscode-light");
        const t = { "editor-background": "#ffffff", "editorWidget-background": "#f8f8f8", "foreground": "#3b3b3b", "descriptionForeground": "#717171", "panel-border": "#e5e5e5", "widget-border": "#e5e5e5", "focusBorder": "#005fb8", "input-background": "#ffffff", "textCodeBlock-background": "#f5f5f5", "list-hoverBackground": "#f2f2f2",
          // the status hues Light Modern really has; without them the alive mark fell back to a pale chart green
          "testing-iconPassed": "#388a34", "testing-iconFailed": "#e51400", "editorWarning-foreground": "#bf8803", "charts-blue": "#005fb8" };
        for (const [k, v] of Object.entries(t)) document.documentElement.style.setProperty("--vscode-" + k, v);
      }
      if (new URLSearchParams(location.search).get("hues")) {
        const hue = (id) => { let h = 2166136261; for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); } return (((h >>> 0) * 0.618033988749895) % 1) * 360; };
        const rgb = (L, C, d) => { const r = d * Math.PI / 180, a = C * Math.cos(r), b = C * Math.sin(r); const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3; const g = (x) => Math.round(Math.max(0, Math.min(1, x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055)) * 255).toString(16).padStart(2, "0"); return "#" + g(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) + g(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) + g(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s); };
        window.__fixture.map.nodes.forEach((n) => { n.color = light ? rgb(0.55, 0.14, hue(n.id)) : rgb(0.72, 0.13, hue(n.id)); });
      }
      // `?actors=<file>`: sessions and a plan merged over the capture, so the forecast band's columns
      // can be looked at before a repository with live sessions is to hand
      const actors = new URLSearchParams(location.search).get("actors");
      const merge = actors ? fetch("./" + actors).then((r) => r.json()).then((a) => Object.assign(window.__fixture, a)) : Promise.resolve();
      return merge.then(() => {
        window.dispatchEvent(new MessageEvent("message", { data: { type: "state", compose: window.__fixture } }));
      });
    })
    .then(() => {
      // `?click=<selector>|<selector>|...`: click each in turn, 500ms apart, so a headless capture can
      // reach the selected-feature and selected-checkpoint states. A selector may end in `:label=Text`
      // to pick the element whose text (or whose lane label) starts with Text.
      const steps = (new URLSearchParams(location.search).get("click") || "").split("|").filter(Boolean);
      const pick = (sel) => {
        const m = sel.match(/^(.*):label=(.*)$/); const css = m ? m[1] : sel, want = m ? m[2] : null;
        const els = [...document.querySelectorAll(css)];
        if (!want) return els[0];
        return els.find((e) => (e.textContent || "").trim().startsWith(want)
          || ((e.closest(".glane") || {}).textContent || "").trim().startsWith(want));
      };
      steps.forEach((sel, i) => setTimeout(() => {
        const e = pick(sel); if (!e) { console.log("no match", sel); return; }
        for (const type of ["pointerdown", "mousedown", "pointerup", "mouseup", "click"]) e.dispatchEvent(new MouseEvent(type, { bubbles: true, clientX: 1, clientY: 1 }));
      }, 400 + i * 500));
      // `?flick=<px per frame>,<frames>`: grab the playhead at the now edge and drag it left that fast
      // for that many frames, then let go -- the gesture the spring, the notches and the coast answer
      // (pair with `raf=timer` and a `--virtual-time-budget` that ends mid-motion to see one frame).
      const flick = (new URLSearchParams(location.search).get("flick") || "").split(",").map(Number);
      if (flick[0]) setTimeout(() => {
        const band = document.querySelector(".frontier-band"); if (!band) return;
        const r = band.getBoundingClientRect(); let x = r.left + 6; const y = r.top + 20;
        const ev = (type, target) => (target || window).dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: x, clientY: y, pointerId: 1, isPrimary: true }));
        ev("pointerdown", band);
        let i = 0; const frames = flick[1] || 12;
        const iv = setInterval(() => { x -= flick[0]; ev("pointermove"); if (++i >= frames) { clearInterval(iv); ev("pointerup"); } }, 16);
      }, 900);
    })
    .catch((e) => { window.__err = String(e); });
</script>
</body>
</html>
