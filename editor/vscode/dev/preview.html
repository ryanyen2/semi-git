<!DOCTYPE html>
<!-- The workbench outside VS Code: VS Code's Modern theme tokens, and a mock host that answers the
     webview protocol from dev/fixtures. Query parameters drive it into one state for a screenshot:
       state=log.json,status.json | empty | uninit | error | none
       plan=<fixture>     reply to a preview (default: the detail fixture's own plan)
       whole=<fixture>    reply to a whole preview, and press Whole when the first preview lands
       detail=<fixture>   reply to show
       select=<address>   a focus message once the state is in
       click=<sel>|<sel>  clicks, in order, at each element's centre
       hover=<sel>        the pointer rests on it
       find=<words>       typed into the find field
       focus=<sel>        give it focus
       keys=<key>,<key>   key presses on the focused element
       apply=1            press Take out when the preview lands
       busy=<verb>        the host is running a verb
       mode=ledger, open=1 (Unnamed open), light=1
     Fixtures load with synchronous XHR, so a file:// page needs Chrome's
     --allow-file-access-from-files. Not shipped (dev/ is .vscodeignore'd). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench preview</title>
<style>
html[data-theme="dark"] {
  --vscode-font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  --vscode-font-size: 13px;
  --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace;
  --vscode-panel-background: #181818;
  --vscode-editor-background: #1f1f1f;
  --vscode-foreground: #cccccc;
  --vscode-descriptionForeground: #9d9d9d;
  --vscode-errorForeground: #f85149;
  --vscode-focusBorder: #0078d4;
  --vscode-editorWarning-foreground: #cca700;
  --vscode-list-hoverBackground: #2a2d2e;
  --vscode-list-inactiveSelectionBackground: #37373d;
  --vscode-input-background: #313131;
  --vscode-input-border: #3c3c3c;
  --vscode-input-foreground: #cccccc;
  --vscode-input-placeholderForeground: #989898;
  --vscode-button-background: #0078d4;
  --vscode-button-foreground: #ffffff;
  --vscode-button-hoverBackground: #026ec1;
  --vscode-button-secondaryBackground: #313131;
  --vscode-button-secondaryForeground: #cccccc;
  --vscode-button-secondaryHoverBackground: #3c3c3c;
  --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
  --vscode-quickInput-background: #222222;
  --vscode-quickInput-foreground: #cccccc;
  --vscode-quickInputList-focusBackground: #04395e;
  --vscode-widget-shadow: rgba(0, 0, 0, 0.36);
  --vscode-progressBar-background: #0078d4;
  --vscode-panelTitle-activeBorder: #0078d4;
  --vscode-diffEditor-insertedLineBackground: rgba(155, 185, 85, 0.2);
  --vscode-diffEditor-removedLineBackground: rgba(255, 0, 0, 0.2);
  color-scheme: dark;
}
html[data-theme="light"] {
  --vscode-font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  --vscode-font-size: 13px;
  --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace;
  --vscode-panel-background: #f8f8f8;
  --vscode-editor-background: #ffffff;
  --vscode-foreground: #3b3b3b;
  --vscode-descriptionForeground: #3b3b3b;
  --vscode-errorForeground: #f85149;
  --vscode-focusBorder: #005fb8;
  --vscode-editorWarning-foreground: #bf8803;
  --vscode-list-hoverBackground: #f2f2f2;
  --vscode-list-inactiveSelectionBackground: #e4e6f1;
  --vscode-input-background: #ffffff;
  --vscode-input-border: #cecece;
  --vscode-input-foreground: #3b3b3b;
  --vscode-input-placeholderForeground: #767676;
  --vscode-button-background: #005fb8;
  --vscode-button-foreground: #ffffff;
  --vscode-button-hoverBackground: #0258a8;
  --vscode-button-secondaryBackground: #e5e5e5;
  --vscode-button-secondaryForeground: #3b3b3b;
  --vscode-button-secondaryHoverBackground: #cccccc;
  --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31);
  --vscode-quickInput-background: #f8f8f8;
  --vscode-quickInput-foreground: #3b3b3b;
  --vscode-quickInputList-focusBackground: #e8e8e8;
  --vscode-widget-shadow: rgba(0, 0, 0, 0.16);
  --vscode-progressBar-background: #005fb8;
  --vscode-panelTitle-activeBorder: #005fb8;
  --vscode-diffEditor-insertedLineBackground: rgba(155, 185, 85, 0.2);
  --vscode-diffEditor-removedLineBackground: rgba(255, 0, 0, 0.2);
  color-scheme: light;
}
</style>
<link href="../media/workbench.css" rel="stylesheet">
<script>
(function () {
  const P = new URLSearchParams(location.search);
  const light = P.get("light") === "1";
  document.documentElement.dataset.theme = light ? "light" : "dark";
  document.addEventListener("DOMContentLoaded", () => document.body.classList.add(light ? "vscode-light" : "vscode-dark"));

  const load = (name) => {
    if (!name) return null;
    const x = new XMLHttpRequest();
    x.open("GET", name.includes("/") ? name : "fixtures/" + name, false);
    x.overrideMimeType("application/json");
    x.send();
    return JSON.parse(x.responseText);
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const stateArg = P.get("state") || "log.json,status.json";
  let log = null, status = null;
  if (stateArg.includes(".json")) {
    const [l, s] = stateArg.split(",");
    log = load(l);
    status = load(s);
  }
  const detail = load(P.get("detail"));
  const planFx = load(P.get("plan")) || (detail && detail.plan) || null;
  const wholeFx = load(P.get("whole"));
  const found = load("find.json");
  window.__posted = [];

  const send = (msg, delay) => setTimeout(() => window.postMessage(msg, "*"), delay || 0);
  const sendState = () => {
    if (stateArg === "none") return;
    if (stateArg === "uninit") return send({ type: "state", log: null, status: null, uninitialized: true });
    if (stateArg === "error") return send({ type: "state", log: null, status: null, error: "ugh log: the op store is behind HEAD; run `ugh check --repair`" });
    if (stateArg === "empty") return send({ type: "state", log: { saves: [] }, status: { drift: { any: false, paths: [] }, choices: [], observed: { head: null } } });
    send({ type: "state", log, status });
  };
  const unitOf = (a) => (a.lastIndexOf("@") > 0 ? a.slice(0, a.lastIndexOf("@")) : a);

  let wholePressed = false, applied = false;
  const press = (selector) => {
    const b = [...document.querySelectorAll(".bar .btn")].find((e) => e.textContent.startsWith(selector));
    if (b) b.click();
  };

  window.acquireVsCodeApi = () => ({
    getState: () => ({ mode: P.get("mode") || "timeline", unnamedOpen: P.get("open") === "1" }),
    setState: () => {},
    postMessage(msg) {
      window.__posted.push(msg);
      switch (msg.type) {
        case "ready":
          sendState();
          if (P.get("busy")) send({ type: "busy", verb: P.get("busy") }, 10);
          break;
        case "preview": {
          const plan = msg.whole ? wholeFx || planFx : planFx;
          send(plan ? { type: "plan", id: msg.id, plan } : { type: "plan", id: msg.id, error: "nothing to " + msg.verb + " at " + msg.addresses.join(" ") }, 40);
          if (wholeFx && !wholePressed) {
            wholePressed = true;
            setTimeout(() => press("Whole"), 120);
          } else if (P.get("apply") === "1" && !applied) {
            applied = true;
            setTimeout(() => press(msg.verb === "restore" ? "Bring back" : "Take out"), 160);
          }
          break;
        }
        case "apply": {
          const base = clone(msg.whole ? wholeFx || planFx : planFx);
          const plan = Object.assign(base, {
            applied: true,
            check: { judge: "check", passed: true, rounds: 1, output: "ok: 62,030 readings, 4 page(s) render: /, /monthly, /sides, /years\n" },
            observed: { head: { verdict: "pass", lines_recorded: true }, delta: { added: 1, removed: 1 }, saves_delta: null, reverses: null },
          });
          send({ type: "busy", verb: msg.verb });
          send({ type: "plan", id: msg.id, plan }, 60);
          const next = clone(log);
          const undone = new Set(base.undone.map((u) => u.address));
          const units = new Set(base.undone.map((u) => unitOf(u.address)));
          for (const s of next.saves) for (const st of s.steps) {
            if (msg.verb === "revert" && undone.has(st.address)) st.out = true;
            if (msg.verb === "restore" && st.out && units.has(unitOf(st.address))) st.out = false;
          }
          log = next;
          send({ type: "state", log, status }, 90);
          send({ type: "busy", verb: null }, 100);
          break;
        }
        case "show":
          send({ type: "detail", id: msg.id, show: detail }, 30);
          break;
        case "find":
          send({ type: "found", id: msg.id, hits: found.hits }, 30);
          break;
      }
    },
  });

  const centre = (e) => {
    const r = e.getBoundingClientRect();
    return { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, bubbles: true };
  };
  window.addEventListener("load", () => {
    let t = 80;
    const at = (fn) => {
      setTimeout(fn, t);
      t += 160;
    };
    if (P.get("select")) at(() => send({ type: "focus", address: P.get("select") }));
    for (const sel of (P.get("click") || "").split("|").filter(Boolean)) {
      at(() => {
        const e = document.querySelector(sel);
        if (e) e.dispatchEvent(new MouseEvent("click", centre(e)));
      });
    }
    if (P.get("hover")) at(() => {
      const e = document.querySelector(P.get("hover"));
      if (e) e.dispatchEvent(new MouseEvent("mousemove", centre(e)));
    });
    if (P.get("find")) at(() => {
      const f = document.querySelector(".find-in");
      f.focus();
      f.value = P.get("find");
      f.dispatchEvent(new Event("input", { bubbles: true }));
    });
    if (P.get("focus")) at(() => {
      const e = document.querySelector(P.get("focus"));
      if (e) e.focus();
    });
    for (const key of (P.get("keys") || "").split(",").filter(Boolean)) {
      at(() => (document.activeElement || document.body).dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true })));
    }
  });
})();
</script>
</head>
<body>
<script src="../media/workbench.js"></script>
</body>
</html>
