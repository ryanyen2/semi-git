<!DOCTYPE html>
<!-- Local dev preview of the Feature Graph webview, outside VS Code. Mocks acquireVsCodeApi,
     supplies VS Code "Dark Modern" theme tokens, and feeds sample data. Open in a browser or
     screenshot headless. Not shipped (under dev/, .vscodeignore'd). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="../media/graph.css" rel="stylesheet">
<style>
  :root {
    --vscode-font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: "SF Mono", Menlo, monospace;
    --vscode-foreground: #cccccc;
    --vscode-editor-background: #1f1f1f;
    --vscode-editorWidget-background: #252526;
    --vscode-editor-foreground: #cccccc;
    --vscode-panel-border: #2b2b2b;
    --vscode-input-foreground: #cccccc;
    --vscode-input-background: #313131;
    --vscode-input-border: #3c3c3c;
    --vscode-focusBorder: #0078d4;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #04395e;
    --vscode-list-activeSelectionForeground: #ffffff;
    --vscode-list-focusOutline: #0078d4;
    --vscode-list-warningForeground: #cca700;
    --vscode-toolbar-hoverBackground: #2a2d2e;
    --vscode-errorForeground: #f14c4c;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-textLink-foreground: #4daafc;
    --vscode-button-secondaryBackground: #313131;
    --vscode-button-secondaryForeground: #cccccc;
    --vscode-inputValidation-warningBackground: #5a4d00;
    --vscode-inputValidation-warningBorder: #cca700;
    --vscode-charts-green: #89d185;
    --vscode-charts-yellow: #cca700;
    --vscode-charts-blue: #75beff;
    --vscode-progressBar-background: #cf6edf;
  }
</style>
</head>
<body class="vscode-dark">
<div id="app">
  <div id="header">
    <span class="brand">◆ Feature Graph</span>
    <span class="crumb-sep">›</span>
    <span id="count" class="crumb"></span>
    <span id="drift" class="chip"></span>
    <span id="presence" class="presence" hidden></span>
    <span class="spacer"></span>
    <button id="refresh" class="icon-btn" title="Refresh">↻</button>
  </div>
  <div id="toolbar">
    <span class="search-icon">⌕</span>
    <input id="filter" type="text" placeholder="Search features…" aria-label="Search features" />
    <span id="legend" aria-hidden="true">
      <span><i class="g">●</i>active</span>
      <span><i class="g">○</i>planned</span>
      <span><i class="g">◐</i>suspended</span>
      <span><i class="g">⚠</i>conflict</span>
    </span>
  </div>
  <canvas id="minimap" aria-hidden="true"></canvas>
  <div id="main">
    <div id="left">
      <div id="colhead"><span class="c-refs">KIND</span><span class="c-graph">GRAPH</span><span class="c-msg">FEATURE</span></div>
      <div id="scroll" tabindex="0">
        <div id="rows"><svg id="lanes" aria-hidden="true"></svg><div id="rowlist"></div></div>
        <div id="empty" hidden>No features yet — run <code>sgt plan "…"</code>.</div>
      </div>
    </div>
    <aside id="detail" hidden></aside>
  </div>
</div>
<script>window.acquireVsCodeApi = () => ({ postMessage() {}, getState() {}, setState() {} });</script>
<script src="../media/graph.js"></script>
<script>
  const E = (op) => ({ op, target: "t", file: "cli.py" });
  // The user's knowledge-graph CLI plan (a wide-shallow DAG) — to compare layout compactness.
  const cap = (id, intent, depends_on, dependents) =>
    ({ id, kind: "capability", status: "planned", intent, depends_on, dependents, effects: [E("add_def")] });
  const graph = {
    count: 7, edges: [],
    nodes: [
      cap("integrate", "Integrate knowledge graph retrieval into the main flow", ["develop", "create"], []),
      cap("main", "Implement the main integrate command entry point", ["parse", "display"], []),
      cap("create", "Create functions to populate the knowledge graph", ["data"], ["integrate"]),
      cap("develop", "Develop functions to query the `knowledge` graph for information retrieval", ["data"], ["integrate"]),
      cap("parse", "Implement parse command line arguments", [], ["main"]),
      cap("display", "Implement display help message", [], ["main"]),
      cap("data", "Implement data structure to represent the graph", [], ["develop", "create"]),
    ],
  };
  const status = { nodes: 7, files: [{ path: "cli.py", lines: 90 }], effects: 7, drift: { any: false, modified: [], added: [], deleted: [], summary: "no drift" } };
  window.dispatchEvent(new MessageEvent("message", { data: { type: "graph", graph, status, editing: [] } }));
  window.dispatchEvent(new MessageEvent("message", { data: { type: "select", id: "develop" } }));
</script>
</body>
</html>
