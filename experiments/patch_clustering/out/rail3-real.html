<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sgt · scale layout on REAL semi-git history</title>
<style>
  :root{
    --bg:#FBFBFA; --panel:#FFFFFF; --panel2:#F9F9F8; --zebra:#FAFAF8;
    --line:#ECECEA; --line-soft:rgba(0,0,0,.05); --line-strong:#DDDDD9;
    --ink:#1B1B1A; --ink2:#3A3A37; --dim:#8B8B85; --faint:#B7B7B1;
    --accent:#3B5BDB; --accent-soft:#E7ECFC;
    --blast:#B45A24; --blast-bg:#FBEBE0; --found:#1F6C9F; --found-bg:#E4F2FB;
    --land:#357a3e; --land-bg:#EAF3E9; --drift:#8f6200; --fail:#9F2F2D;
    --sans:'SF Pro Display',-apple-system,'Segoe UI','Helvetica Neue',system-ui,sans-serif;
    --mono:'SF Mono','Geist Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --railw:290px; --rowh:27px; --rulerh:28px; --inspw:318px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0; background:#EDEDEA; color:var(--ink); font-family:var(--sans); font-size:13px;
       -webkit-font-smoothing:antialiased; letter-spacing:-0.006em; display:flex; align-items:center; justify-content:center; padding:20px}
  .win{width:min(1420px,100%); height:min(880px,calc(100vh - 40px)); background:var(--panel); border:1px solid var(--line-strong);
       border-radius:13px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 60px -28px rgba(20,20,30,.28); position:relative}
  .titlebar{height:42px; flex:none; display:flex; align-items:center; gap:14px; padding:0 15px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#fff,#FBFBFA)}
  .dots{display:flex; gap:8px} .dots i{width:12px;height:12px;border-radius:50%;display:block}
  .dots .r{background:#F0655A}.dots .y{background:#F5BE4F}.dots .g{background:#61C554}
  .brand{font-weight:600} .brand .mono{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-weight:450}
  .spacer{flex:1}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:11.5px}
  .seg button{border:0; background:var(--panel); color:var(--ink2); padding:5px 11px; cursor:pointer; font-family:var(--sans); border-left:1px solid var(--line)}
  .seg button:first-child{border-left:0} .seg button.on{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .stat{font-family:var(--mono); font-size:11px; color:var(--dim)} .stat b{color:var(--ink);font-weight:550}
  .mini{font-family:var(--mono); font-size:11px; cursor:pointer; padding:3px 8px; border-radius:6px; color:var(--ink2); border:1px solid var(--line)}
  .mini:hover{background:var(--panel2)}

  .main{flex:1; display:flex; min-height:0}

  /* ── shared-scroll gantt viewport ─────────────────────────────── */
  .viewport{flex:1; overflow:auto; position:relative; min-height:0; background:var(--panel2)}
  .rulerrow{position:sticky; top:0; z-index:4; display:flex; width:max-content; background:var(--panel); border-bottom:1px solid var(--line)}
  .corner{position:sticky; left:0; z-index:6; width:var(--railw); min-width:var(--railw); height:var(--rulerh);
          display:flex; align-items:center; padding:0 12px; background:var(--panel); border-right:1px solid var(--line);
          font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim); font-weight:600}
  .rwrap{flex:none}
  .datarow{display:flex; width:max-content; align-items:flex-start}
  .labels{position:sticky; left:0; z-index:3; width:var(--railw); min-width:var(--railw); background:var(--panel); border-right:1px solid var(--line)}
  .bwrap{flex:none}

  .node{height:var(--rowh); display:flex; align-items:center; gap:6px; padding:0 10px; cursor:pointer; position:relative; font-size:12px}
  .node:nth-child(odd){background:var(--zebra)}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--accent-soft)}
  .node.sel::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;background:var(--accent);border-radius:2px}
  .node .car{width:11px;font-size:9px;color:var(--faint);flex:none;text-align:center}
  .node .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node.internal{font-weight:600;color:var(--ink)}
  .node.leaf{color:var(--ink2)}
  .node .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);flex:none}
  .node.dim{opacity:.26}

  svg{display:block} svg text{font-family:var(--mono); font-size:10px; fill:var(--dim)}
  .zeb{fill:var(--zebra)}
  .aftertint{fill:rgba(120,120,140,.045)}
  .grid-l{stroke:var(--line);stroke-width:1} .grid-l.maj{stroke:var(--line-strong)}
  .rowhit{fill:transparent; cursor:pointer}
  .rowg{transition:opacity .18s cubic-bezier(.16,1,.3,1)}
  svg.focus .rowg{opacity:.12} svg.focus .rowg.on{opacity:1}
  .glyph{font-size:11px;cursor:pointer;user-select:none}
  .lifebar{stroke-width:5;stroke-linecap:round;opacity:.75}
  .dep{fill:none;stroke-width:1.5;opacity:.95}
  .dep.found{stroke:var(--found)} .dep.blast{stroke:var(--blast)}
  .dep-lab{font-size:8.5px;fill:var(--dim)}
  .phline{stroke:var(--accent);stroke-width:1.5}
  .phg{transition:transform .12s cubic-bezier(.16,1,.3,1)}
  .phflag{fill:var(--accent);cursor:ew-resize} .phflag-t{fill:#fff;font-size:9px;font-weight:600;font-family:var(--mono);pointer-events:none}

  /* ── docked inspector ─────────────────────────────────────────── */
  .inspector{width:var(--inspw); min-width:var(--inspw); flex:none; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0}
  .insphead{height:var(--rulerh); flex:none; display:flex; align-items:center; padding:0 14px; border-bottom:1px solid var(--line); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim); font-weight:600}
  .inspbody{flex:1; overflow:auto; padding:15px 15px 30px}
  .insp h2{font-size:14.5px; margin:0 0 3px; letter-spacing:-0.015em; line-height:1.25}
  .insp .sub{color:var(--dim); font-size:11px; margin:0 0 7px; font-family:var(--mono)}
  .insp .why{color:var(--ink2); font-style:italic; margin:7px 0 4px; font-size:12px; line-height:1.5}
  .tag{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.04em; padding:2px 8px; border-radius:9999px; margin:0 4px 5px 0}
  .tag.found{background:var(--found-bg); color:var(--found)} .tag.blast{background:var(--blast-bg); color:var(--blast)} .tag.land{background:var(--land-bg); color:var(--land)}
  .isec{margin-top:15px; border-top:1px solid var(--line); padding-top:11px}
  .isec .lab{font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim); font-weight:600; margin-bottom:7px}
  .mem{font-family:var(--mono); font-size:11px; color:var(--dim); margin:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mem .q{color:var(--ink2)}
  .lnk{cursor:pointer} .lnk:hover{color:var(--found)}
  .subj{font-size:11.5px; color:var(--ink2); margin:5px 0; line-height:1.4; display:flex; gap:7px}
  .subj .cc{font-family:var(--mono); color:var(--faint); flex:none}
  .glossrow{display:flex; gap:9px; align-items:flex-start; margin:8px 0; font-size:11.5px; color:var(--dim); line-height:1.4}
  .glossrow .gi{flex:none; width:34px; text-align:center; font-family:var(--mono); color:var(--ink); font-size:12px}
  .glossrow .gi .fade{opacity:.28}
  .glossrow b{color:var(--ink2)}
  .swz{display:inline-block;width:18px;height:11px;border-radius:2px;flex:none}
  .empty-note{color:var(--dim); font-size:11.5px; line-height:1.5; margin-bottom:6px}

  /* ── op tooltip ───────────────────────────────────────────────── */
  #tip{position:fixed; z-index:50; pointer-events:none; background:#1B1B1A; color:#fff; font-size:11px; font-family:var(--sans);
       padding:6px 9px; border-radius:7px; max-width:280px; line-height:1.4; box-shadow:0 8px 24px -10px rgba(0,0,0,.4); display:none}
  #tip .k{font-family:var(--mono); color:#9ec1ff; font-size:10px}
  #tip .s{color:#d9d9d6}

  ::view-transition-group(root){ animation-duration:.30s; animation-timing-function:cubic-bezier(.16,1,.3,1) }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="brand">sgt <span class="mono">· REAL data · semi-git · 54 commits · clustered</span></div>
    <div class="spacer"></div>
    <span class="stat" id="stat"></span>
    <span class="mini" id="collapseAll">collapse all</span>
    <div class="seg" id="depmode">
      <button data-m="focus" class="on">co-change edges</button>
      <button data-m="off">no edges</button>
    </div>
  </div>

  <div class="main">
    <div class="viewport" id="viewport">
      <div class="rulerrow">
        <div class="corner">feature hierarchy</div>
        <div class="rwrap"><svg id="rulerSvg"></svg></div>
      </div>
      <div class="datarow">
        <div class="labels" id="labels"></div>
        <div class="bwrap"><svg id="body"></svg></div>
      </div>
    </div>
    <div class="inspector">
      <div class="insphead" id="insphead">inspector</div>
      <div class="inspbody" id="insp"></div>
    </div>
  </div>
</div>
<div id="tip"></div>

<script src="real-slim.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   REAL semi-git data (patch-clustering of this repo's own 54 commits).
   Tree/labels/time/members/subjects/co-change are real. The true op-
   level requires DAG lives in the kernel store (order.downset_in), NOT
   this static export — edges here are honest CO-CHANGE (newer→older).
   ════════════════════════════════════════════════════════════════ */
const D=window.RAILDATA, nodes=D?D.nodes:null, NC=D?D.ncommits:0, roots=D?D.roots:[], COMMITS=D?D.commits:[];
if(D){ nodes.__root__={id:'__root__',label:'HEAD',children:roots.slice(),parent:null,depth:-1}; }
const foundAdj={}, blastAdj={};
if(D) for(const [a,b] of D.edges){ (foundAdj[a] ||= []).push(b); (blastAdj[b] ||= []).push(a); }

let expanded=new Set(['__root__']), sel=null, depmode='focus', head=Math.round(NC*0.6);

const ROWH=27, RULERH=28, ARCGUT=46, COLGAP=22, RIGHTPAD=128;
const TLW = ARCGUT + (NC-1)*COLGAP + RIGHTPAD;
function colX(c){ return ARCGUT + c*COLGAP; }

function isLeaf(n){ return !n.children||!n.children.length; }
function visibleRows(){ const out=[];
  (function w(id,d){ const n=nodes[id]; if(id!=='__root__') out.push({id,depth:d,node:n});
    if(id==='__root__'||expanded.has(id)) for(const c of (n.children||[])) w(c, id==='__root__'?0:d+1);
  })('__root__',0); return out; }
function ancestors(id){ const a=[]; let c=nodes[id]?.parent; while(c&&c!=='__root__'){a.push(c); c=nodes[c]?.parent;} return a; }
function repRow(id,visSet){ let c=id; while(c&&!visSet.has(c)) c=nodes[c]?.parent; return c; }
function countLeaves(id){ const n=nodes[id]; if(isLeaf(n))return 1; return n.children.reduce((a,c)=>a+countLeaves(c),0); }

function closure(seed,adj){ const seen=new Set(),q=[seed]; while(q.length){const x=q.pop(); for(const y of (adj[x]||[])) if(!seen.has(y)){seen.add(y);q.push(y);} } return seen; }
function reduceEdges(list){ const adj={}; for(const[u,w]of list)(adj[u]||=new Set()).add(w);
  const reach=(s,av)=>{const seen=new Set(),st=[];for(const n of(adj[s]||[]))if(n!==av)st.push(n);while(st.length){const x=st.pop();if(seen.has(x))continue;seen.add(x);for(const y of(adj[x]||[]))st.push(y);}return seen;};
  return list.filter(([u,w])=>!reach(u,w).has(w)); }
function focusFeatures(){ if(!sel||!isLeaf(nodes[sel]))return null; const found=closure(sel,foundAdj),blast=closure(sel,blastAdj); return {found,blast,all:new Set([sel,...found,...blast])}; }
function focusRowSet(){ const ff=focusFeatures(); if(!ff)return null; const vis=new Set(visibleRows().map(r=>r.id)); const s=new Set(); for(const f of ff.all)s.add(repRow(f,vis)); return s; }

/* ── left labels ───────────────────────────────────────────────── */
function renderLabels(){ const el=document.getElementById('labels'); el.innerHTML='';
  const focusRows=focusRowSet();
  for(const r of visibleRows()){ const n=r.node, d=document.createElement('div'); const leaf=isLeaf(n);
    d.className='node '+(leaf?'leaf':'internal'); d.style.paddingLeft=(10+r.depth*15)+'px'; d.dataset.id=n.id;
    if(sel===n.id)d.classList.add('sel');
    if(focusRows && !focusRows.has(n.id) && !ancestors(sel||'').includes(n.id)) d.classList.add('dim');
    const car=leaf?'':(expanded.has(n.id)?'▾':'▸');
    const cnt=leaf?`<span class="cnt">c${n.commits.length}</span>`:`<span class="cnt">${countLeaves(n.id)}</span>`;
    d.innerHTML=`<span class="car">${car}</span><span class="name">${n.label}</span>${cnt}`;
    d.onclick=(e)=>{ if(leaf){ selectNode(n.id,false); } else if(e.target.classList.contains('car')){ toggle(n.id); } else { selectNode(n.id,false); toggle(n.id); } };
    el.appendChild(d);
  }
}
function toggle(id){ expanded.has(id)?expanded.delete(id):expanded.add(id); animatedRender(); }
function animatedRender(){ if(document.startViewTransition){ document.startViewTransition(()=>renderAll()); } else renderAll(); }

/* ── ruler (sticky) — holds the playhead flag ──────────────────── */
function renderRuler(){ const svg=document.getElementById('rulerSvg'); svg.setAttribute('width',TLW); svg.setAttribute('height',RULERH); svg.innerHTML='';
  for(let c=0;c<NC;c+=6) add(svg,'text',{x:colX(c),y:18,'text-anchor':'middle'},'c'+c);
  // click anywhere on the ruler to move the playhead
  const bg=add(svg,'rect',{x:0,y:0,width:TLW,height:RULERH,fill:'transparent'}); bg.style.cursor='ew-resize'; bg.onpointerdown=dragHead;
  const g=add(svg,'g',{class:'phg',id:'phRuler',transform:`translate(${colX(head)},0)`});
  const flag=add(g,'rect',{x:-2,y:6,width:34,height:16,rx:3,class:'phflag'});
  add(g,'text',{x:15,y:18,'text-anchor':'middle',class:'phflag-t',id:'phLabel'},'c'+head);
  flag.onpointerdown=dragHead;
}

/* ── timeline body ─────────────────────────────────────────────── */
function renderBody(){ const svg=document.getElementById('body'); const vis=visibleRows(); const H=vis.length*ROWH;
  svg.setAttribute('width',TLW); svg.setAttribute('height',Math.max(H,10)); svg.innerHTML='';
  const ff=focusFeatures(); svg.classList.toggle('focus', !!ff && depmode!=='off');

  vis.forEach((r,i)=>{ if(i%2===0) add(svg,'rect',{x:0,y:i*ROWH,width:TLW,height:ROWH,class:'zeb'}); });
  add(svg,'rect',{id:'afterTint',class:'aftertint',x:colX(head),y:0,width:Math.max(0,TLW-colX(head)),height:H}); // not-yet-folded region
  for(let c=0;c<NC;c+=6) add(svg,'line',{x1:colX(c),y1:0,x2:colX(c),y2:H,class:'grid-l'+(c%12?'':' maj')});

  const rowY={}; vis.forEach((r,i)=>rowY[r.id]=i*ROWH+ROWH/2);
  const focusRows= ff && depmode!=='off' ? focusRowSet() : null;
  vis.forEach((r,i)=>{ const y=rowY[r.id];
    // full-width invisible hit target → click a track to select+highlight in tree
    const hit=add(svg,'rect',{x:0,y:i*ROWH,width:TLW,height:ROWH,class:'rowhit'}); hit.onclick=()=>selectNode(r.id,true);
    const g=add(svg,'g',{class:'rowg'}); if(focusRows&&focusRows.has(r.id)) g.classList.add('on');
    isLeaf(r.node)?renderLeaf(g,r.node,y):renderHeat(g,r.node,y);
  });
  if(ff && depmode==='focus') drawEdges(svg,ff,vis,rowY);
  const gph=add(svg,'g',{class:'phg',id:'phBody',transform:`translate(${colX(head)},0)`});
  add(gph,'line',{x1:0,y1:0,x2:0,y2:H,class:'phline'});

  const leafCount=Object.values(nodes).filter(n=>n!==nodes.__root__ && isLeaf(n)).length;
  document.getElementById('stat').innerHTML=`<b>${leafCount}</b> features · <b>${vis.length}</b> lanes · edges: <b>${lastEdges}</b>${ff?` / ${ff.all.size-1} in closure`:''}`;
}
let lastEdges=0;
function opKind(f,c){ if(c===f.birth)return 'born'; if(c===f.last&&f.last!==f.birth)return 'reworked'; return 'extended'; }
function opGlyph(f,c){ const k=opKind(f,c); return k==='born'?'◆':k==='reworked'?'~':'+'; }
function renderLeaf(g,f,y){ if(!f.commits.length)return;
  add(g,'line',{x1:colX(f.birth),y1:y,x2:colX(f.last),y2:y,class:'lifebar',stroke:'#cfcfca'});
  for(const c of f.commits){ const t=add(g,'text',{x:colX(c),y:y+4,'text-anchor':'middle',class:'glyph',fill:'var(--ink)',opacity:c>head?0.28:1},opGlyph(f,c));
    t.dataset.c=c;
    t.onclick=(e)=>{e.stopPropagation();selectNode(f.id,true);};
    t.onmouseenter=(e)=>showTip(e,f,c); t.onmousemove=moveTip; t.onmouseleave=hideTip; }
}
function renderHeat(g,n,y){ const b=new Array(NC).fill(0); let leaves=0;
  (function ga(id){const x=nodes[id]; if(isLeaf(x)){leaves++; for(const c of x.commits)b[c]++;} else x.children.forEach(ga);})(n.id);
  const mx=Math.max(1,...b), bw=COLGAP;
  for(let c=0;c<NC;c++){ if(!b[c])continue; const inop=(0.16+0.55*b[c]/mx).toFixed(3);
    const r=add(g,'rect',{x:colX(c)-bw/2,y:y-7,width:Math.max(2,bw-2),height:14,rx:2,fill:c>head?'#e6e6e2':'var(--land)',opacity:c>head?0.55:inop,class:'heat'}); r.dataset.c=c; r.dataset.inop=inop; }
  add(g,'text',{x:TLW-RIGHTPAD+18,y:y+3,fill:'var(--faint)','font-size':'9px'},`${leaves} feats`);
}
function drawEdges(svg,ff,vis,rowY){ const edges=[];
  for(const f of [sel,...ff.found]) for(const b of (foundAdj[f]||[])) if(ff.all.has(b)) edges.push([f,b,'found']);
  for(const f of [sel,...ff.blast]) for(const a of (blastAdj[f]||[])) if(ff.all.has(a)) edges.push([a,f,'blast']);
  const kind={}; edges.forEach(e=>kind[e[0]+'>'+e[1]]=e[2]);
  const reduced=reduceEdges(edges.map(e=>[e[0],e[1]]));
  const visSet=new Set(vis.map(r=>r.id)), agg={};
  for(const[u,w]of reduced){ const ru=repRow(u,visSet),rw=repRow(w,visSet); if(!ru||!rw||ru===rw)continue; const k=ru+'>'+rw; (agg[k]||={u:ru,w:rw,n:0,kind:kind[u+'>'+w]||'found'}).n++; }
  lastEdges=Object.keys(agg).length;
  for(const k in agg){ const{u,w,n,kind:kk}=agg[k]; const y1=rowY[u],y2=rowY[w]; if(y1==null||y2==null)continue;
    const gx=ARCGUT-8, bend=Math.min(38,10+Math.abs(y1-y2)*0.28);
    add(svg,'path',{d:`M ${gx} ${y1} C ${gx-bend} ${y1}, ${gx-bend} ${y2}, ${gx} ${y2}`,class:'dep '+kk});
    if(n>1) add(svg,'text',{x:gx-bend-3,y:(y1+y2)/2,'text-anchor':'end',class:'dep-lab'},'×'+n); }
}

/* ── playhead: snap to grid, light update (no full re-render) ──── */
function updateHead(){ const x=colX(head);
  const pr=document.getElementById('phRuler'), pb=document.getElementById('phBody');
  if(pr)pr.setAttribute('transform',`translate(${x},0)`); if(pb)pb.setAttribute('transform',`translate(${x},0)`);
  const lbl=document.getElementById('phLabel'); if(lbl)lbl.textContent='c'+head;
  const at=document.getElementById('afterTint'); if(at){at.setAttribute('x',x); at.setAttribute('width',Math.max(0,TLW-x));}
  document.querySelectorAll('#body .glyph').forEach(g=>g.setAttribute('opacity', (+g.dataset.c)>head?0.28:1));
  document.querySelectorAll('#body .heat').forEach(r=>{ const c=+r.dataset.c; if(c>head){r.setAttribute('fill','#e6e6e2');r.setAttribute('opacity',0.55);} else {r.setAttribute('fill','var(--land)');r.setAttribute('opacity',r.dataset.inop);} });
}
function dragHead(e){ e.preventDefault(); const svg=document.getElementById('rulerSvg');
  const set=(ev)=>{ const rect=svg.getBoundingClientRect(); const scale=TLW/rect.width; const x=(ev.clientX-rect.left)*scale;
    const snapped=Math.max(0,Math.min(NC-1,Math.round((x-ARCGUT)/COLGAP))); if(snapped!==head){ head=snapped; updateHead(); } };
  set(e);
  const up=()=>{window.removeEventListener('pointermove',set);window.removeEventListener('pointerup',up);};
  window.addEventListener('pointermove',set); window.addEventListener('pointerup',up); }

/* ── op hover tooltip ──────────────────────────────────────────── */
function showTip(e,f,c){ const t=document.getElementById('tip'); const cm=COMMITS[c]||{}; const kind=opKind(f,c);
  t.innerHTML=`<span class="k">op · c${c} · ${kind}</span><br><b>${f.label}</b><br><span class="s">${cm.short||''} ${cm.subject||''}</span>`;
  t.style.display='block'; moveTip(e); }
function moveTip(e){ const t=document.getElementById('tip'); let x=e.clientX+14, y=e.clientY+14;
  const w=t.offsetWidth||220; if(x+w>window.innerWidth-8) x=e.clientX-w-14; t.style.left=x+'px'; t.style.top=y+'px'; }
function hideTip(){ document.getElementById('tip').style.display='none'; }

/* ── selection + highlight-in-tree ─────────────────────────────── */
function selectNode(id, scrollTree){ sel=id; ancestors(id).forEach(a=>expanded.add(a));
  renderAll();
  if(scrollTree){ const row=document.querySelector(`#labels .node[data-id="${id}"]`); if(row) row.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ── inspector (docked; detail on select, legend otherwise) ────── */
function renderInspector(){ const el=document.getElementById('insp'), hd=document.getElementById('insphead');
  if(!sel){ hd.textContent='how to read this';
    el.innerHTML=`
      <div class="empty-note">The <b>playhead</b> sets the ideal: everything left of it is folded into <b>code(I)</b>; everything right is not yet in.</div>
      <div class="isec"><div class="lab">ops on a feature row</div>
        <div class="glossrow"><span class="gi">◆</span><div><b>born</b> — the op that created the feature</div></div>
        <div class="glossrow"><span class="gi">+</span><div><b>extended</b> — added to it</div></div>
        <div class="glossrow"><span class="gi">~</span><div><b>reworked</b> — changed in place</div></div>
        <div class="glossrow"><span class="gi"><span class="fade">+</span></span><div><b>faded</b> = right of the playhead, <b>not folded into code(I)</b> yet</div></div>
      </div>
      <div class="isec"><div class="lab">collapsed lane</div>
        <div class="glossrow"><span class="swz" style="background:var(--land);opacity:.5"></span><div><b>commit-density heatstrip</b> — a subsystem's N feature rows folded into one; darker = more of its features changed that commit</div></div>
      </div>
      <div class="isec"><div class="lab">dependency edges (on select)</div>
        <div class="glossrow"><span class="swz" style="background:var(--found)"></span><div><b>foundation ↓</b> — what the feature co-changes with earlier</div></div>
        <div class="glossrow"><span class="swz" style="background:var(--blast)"></span><div><b>blast ↑</b> — what co-changes with it later</div></div>
        <div class="empty-note" style="margin-top:8px">Edges are drawn <b>on focus only</b>, transitively reduced, aggregated to ancestor lanes (<span style="font-family:var(--mono)">×n</span>). These are <b>co-change</b>, not the true requires DAG (that lives in the kernel op store).</div>
      </div>
      <div class="empty-note" style="margin-top:14px">Click a feature or a lane to inspect it. Hover an op for its commit.</div>`;
    return;
  }
  const n=nodes[sel], leaf=isLeaf(n), ff=focusFeatures();
  hd.textContent = leaf?'feature':'subsystem';
  let tags='';
  if(leaf && ff){ tags=`<span class="tag found">${ff.found.size} foundation</span><span class="tag blast">${ff.blast.size} blast</span>`; }
  else if(!leaf){ tags=`<span class="tag land">${countLeaves(n.id)} features</span>`; }
  const commitsList = n.commits.map(c=>`<div class="subj"><span class="cc">c${c}</span><span>${(COMMITS[c]||{}).subject||''}</span></div>`).join('');
  let depSec='';
  if(leaf && ff && (ff.found.size||ff.blast.size)){
    const rows=[...[...ff.found].map(f=>['↓','found',f]),...[...ff.blast].map(f=>['↑','blast',f])];
    depSec=`<div class="isec"><div class="lab">co-change dependencies</div>${rows.map(([ar,cl,f])=>`<div class="mem lnk" onclick="selectNode('${f}',true)"><span style="color:var(--${cl})">${ar}</span> ${nodes[f].label}</div>`).join('')}</div>`;
  }
  el.innerHTML=`
    <h2>${n.label}</h2>
    <div class="sub">${n.dir||'—'} · ${n.nmem||n.size} members · commits ${n.birth}→${n.last}</div>
    <div>${tags}</div>
    ${n.why?`<div class="why">${n.why}</div>`:''}
    ${depSec}
    <div class="isec"><div class="lab">members${n.nmem>n.members.length?` · ${n.nmem} total`:''}</div>
      ${n.members.map(m=>{const p=m.split('::'); return `<div class="mem">${p[0]}::<span class="q">${p[1]||''}</span></div>`;}).join('')}
      ${n.nmem>n.members.length?`<div class="mem" style="color:var(--faint)">+${n.nmem-n.members.length} more</div>`:''}
    </div>
    <div class="isec"><div class="lab">changed in ${n.commits.length} commits</div>${commitsList}</div>`;
}

function add(p,t,a,tx){ const e=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in a)e.setAttribute(k,a[k]); if(tx!=null)e.textContent=tx; p.appendChild(e); return e; }
function renderAll(){ renderLabels(); renderRuler(); renderBody(); renderInspector(); }

document.getElementById('depmode').onclick=(e)=>{ const b=e.target.closest('button'); if(!b)return; depmode=b.dataset.m; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); renderBody(); };
document.getElementById('collapseAll').onclick=()=>{ expanded=new Set(['__root__']); sel=null; animatedRender(); };

if(!D){ document.getElementById('labels').innerHTML='<div style="padding:16px;color:var(--fail)">real-slim.js not loaded</div>'; } else renderAll();
</script>
</body>
</html>
