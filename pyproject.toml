[project]
name = "ugh"
version = "0.6.10"
description = "Semantic feature-level version control over git"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Yen", email = "ryanyen2@mit.edu" }]
keywords = ["git", "version-control", "refactoring", "code-review", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23",
]

[project.urls]
Homepage = "https://github.com/ryanyen2/ugh"
Repository = "https://github.com/ryanyen2/ugh"
Issues = "https://github.com/ryanyen2/ugh/issues"

[project.scripts]
ugh = "ugh.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ugh*"]

# The agent assets `ugh init --agent` copies into a repo (Claude Code skills). They ship inside the
# wheel so the command works from a plain `uv tool install`, with no checkout present.
[tool.setuptools.package-data]
"ugh.agent_assets" = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
