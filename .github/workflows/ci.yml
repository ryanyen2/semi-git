name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Most of the suite drives real git repos through subprocesses, so a committer identity has
      # to exist or `git commit` fails on a fresh runner.
      - name: Configure git
        run: |
          git config --global user.email "ci@semi-git.local"
          git config --global user.name "semi-git CI"
          git config --global init.defaultBranch main

      # `tui` too: the consequence-pane tests exercise a real CLI path (`sgt resolve` on a tty), so
      # skipping them locally-only would hide exactly the kind of undeclared import that first
      # turned this job red.
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra tui

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
        timeout-minutes: 30

      # Guards the docs layer: every `sgt ...` command quoted in the README, the guide, or the
      # bundled agent skills has to dispatch against the live CLI. Prose drifts silently because
      # nothing executes it, and an agent handed a command that no longer exists will thrash.
      - name: Check documented commands
        run: uv run --python ${{ matrix.python-version }} python -m scripts.check_docs_commands

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json

      - name: Install
        run: npm ci
        working-directory: editor/vscode

      - name: Type-check and bundle
        run: npm run package
        working-directory: editor/vscode
